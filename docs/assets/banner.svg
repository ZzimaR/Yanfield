<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="砚田 Yanfield — 本地优先的开源 AI 长篇小说创作工作台">
  <title>砚田 Yanfield</title>
  <desc>README 顶部横幅：宣纸底、墨色标题「砚田 YANFIELD」、一行定位语与浅蓝印章。</desc>

  <!-- 宣纸底 + 极淡的纸纹 -->
  <rect width="1200" height="300" fill="#f5f1e8"/>
  <g stroke="#e2d9c7" stroke-width="1" opacity="0.5">
    <path d="M0 75h1200M0 150h1200M0 225h1200"/>
  </g>

  <!-- 左侧：标识（墨滴 + 舟） -->
  <g transform="translate(72 74) scale(1.15)">
    <circle cx="32" cy="26" r="17.5" fill="#201d18"/>
    <path d="M32 4.2c2.7 2.9 5 6.2 5 9.1 0 2.9-2.2 5-5 5s-5-2.1-5-5c0-2.9 2.3-6.2 5-9.1Z" fill="#201d18"/>
    <path d="M6.5 43.8c7.4 3.9 16.1 5.9 25.5 5.9s18.1-2 25.5-5.9c-3 9.4-13.1 15.4-25.5 15.4S9.5 53.2 6.5 43.8Z" fill="#201d18"/>
    <g stroke="#201d18" stroke-width="1.8" stroke-linecap="round" opacity="0.35">
      <path d="M14 60.4c3.6-1.7 8-1.7 11.6 0"/>
      <path d="M38.4 60.4c3.6-1.7 8-1.7 11.6 0"/>
    </g>
  </g>

  <!-- 标题 -->
  <text x="176" y="122"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',STSong,serif"
        font-size="66" font-weight="700" fill="#201d18">砚田 <tspan font-size="34" letter-spacing="4" fill="#6b6458" dy="-8">YANFIELD</tspan></text>

  <text x="180" y="166"
        font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="24" fill="#4a4439">本地优先的开源 AI 长篇小说创作工作台</text>

  <!-- 三个关键词 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#6b6458">
    <g transform="translate(180 196)">
      <rect y="4" width="7" height="7" rx="1.5" fill="#3a94e0"/>
      <text x="17" y="12">书稿 = 一个 SQLite 文件</text>
    </g>
    <g transform="translate(404 196)">
      <rect y="4" width="7" height="7" rx="1.5" fill="#2f5d62"/>
      <text x="17" y="12">AI 改动必须逐块 diff 审阅</text>
    </g>
    <g transform="translate(690 196)">
      <rect y="4" width="7" height="7" rx="1.5" fill="#a97f2b"/>
      <text x="17" y="12">接任意 OpenAI 兼容 API</text>
    </g>
  </g>

  <!-- 浅蓝印：砚田 -->
  <g transform="translate(1086 78)">
    <rect width="64" height="64" rx="8" fill="#3a94e0"/>
    <text x="32" y="45" text-anchor="middle"
          font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',STSong,serif"
          font-size="34" font-weight="700" fill="#f5f1e8">田</text>
  </g>
  <text x="1118" y="172" text-anchor="middle"
        font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="13" fill="#8a8378">NONCOMMERCIAL</text>
